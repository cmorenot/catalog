<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Catálogo NS CEMT</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');

    :root {
        --nintendo-red: #E60012;
        --nintendo-blue: #00A2ED;
        --nintendo-white: #FFFFFF;
        --nintendo-light: #FFF5F7;
        --nintendo-contrast: #111111;
    }

    body {
        margin: 0;
        font-family: 'Roboto', Arial, sans-serif;
        background: radial-gradient(circle at top left, rgba(230, 0, 18, 0.18), transparent 28%),
                    linear-gradient(135deg, #fff 0%, #f8f8f8 45%, #fde6e8 100%);
        color: var(--nintendo-contrast);
        min-height: 100vh;
    }

    /* =========================
       HEADER
    ========================= */
    header {
        padding: 14px 18px;
        background: linear-gradient(90deg, var(--nintendo-red), #c8000f);
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        box-shadow: 0 10px 24px rgba(0,0,0,0.18);
        border-bottom: 2px solid rgba(255,255,255,0.35);
        color: var(--nintendo-white);
    }

    .header-left {
        display: flex;
        align-items: center;
        gap: 14px;
    }

    .logo {
        height: 38px;
        width: auto;
        filter: drop-shadow(0 2px 6px rgba(0,0,0,0.25));
    }

    .nav-controls {
        display: flex;
        align-items: center;
        background: rgba(255,255,255,0.14);
        border-radius: 9999px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.28);
    }

    .nav-link {
        text-decoration: none;
        color: var(--nintendo-white);
        padding: 8px 16px;
        font-size: 14px;
        font-weight: 500;
        transition: all 0.2s;
    }

    .nav-link:hover {
        background: rgba(255,255,255,0.18);
        color: var(--nintendo-white);
    }

    /* =========================
       SEARCH BAR
    ========================= */
    .search-bar {
        margin-top: 8px;
        display: flex;
        gap: 10px;
        align-items: center;
    }

    .search-bar input {
        flex: 1;
        max-width: 340px;
        padding: 10px 16px;
        border-radius: 9999px;
        border: 2px solid rgba(255,255,255,0.35);
        outline: none;
        background: rgba(255,255,255,0.95);
        color: var(--nintendo-contrast);
        font-size: 15px;
    }

    .search-bar input:focus {
        border-color: var(--nintendo-blue);
        box-shadow: 0 0 0 4px rgba(0,162,237,0.12);
    }

    .search-bar select {
        padding: 10px 14px;
        border-radius: 9999px;
        border: 2px solid rgba(255,255,255,0.35);
        outline: none;
        background: rgba(255,255,255,0.95);
        color: var(--nintendo-contrast);
        font-size: 14px;
        cursor: pointer;
    }

    /* =========================
       GRID
    ========================= */
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 20px;
        padding: 24px;
    }


    .card:hover {
        transform: translateY(-8px);
        box-shadow: 0 18px 32px rgba(230,0,18,0.18);
        border-color: var(--nintendo-red);
    }

.card {
    border-radius: 16px;
    overflow: hidden;
    background: linear-gradient(180deg, #ffffff 0%, #ffe8ea 100%);
    box-shadow: 0 10px 24px rgba(0,0,0,0.12);
    cursor: pointer;
    transition: all 0.25s ease;
    border: 2px solid rgba(230,0,18,0.12);
    display: flex;
    flex-direction: column;
}

/* HACEMOS LA IMAGEN MÁS ALTA */
.img-box {
    width: 100%;
    height: 320px; /* 👈 antes 260px */
    overflow: hidden;
    background: #F1F3F5;
}

.img-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
}
    .card:hover img {
        transform: scale(1.06);
    }

    .title {
        padding: 12px 12px 4px;
        font-size: 15px;
        font-weight: 500;
        color: #1C1C1C;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .size {
        padding: 0 12px 12px;
        font-size: 13px;
        color: #666;
        font-weight: 400;
    }

    /* =========================
       MODAL
    ========================= */
    #modal {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.85);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999;
    }

    #modal-content {
        width: 92%;
        max-width: 1000px;
        max-height: 92vh;
        overflow-y: auto;
        background: linear-gradient(180deg, #ffffff 0%, #ffe7ea 65%, #fff1f4 100%);
        border-radius: 22px;
        padding: 24px;
        position: relative;
        box-shadow: 0 24px 48px rgba(0,0,0,0.28);
        border: 1px solid rgba(230,0,18,0.18);
    }

    #close-btn {
        position: absolute;
        top: 18px;
        right: 18px;
        background: var(--nintendo-red);
        border: none;
        color: white;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 18px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.18);
    }

    #modal-body {
        display: flex;
        flex-direction: column;
        gap: 18px;
        margin-top: 12px;
    }

    #modal-top {
        display: flex;
        gap: 18px;
        align-items: flex-start;
        justify-content: space-between;
    }

    #modal-img-wrap {
        flex: 0 0 42%;
        min-width: 240px;
        border-radius: 20px;
        overflow: hidden;
        background: white;
        box-shadow: inset 0 0 0 1px rgba(230,0,18,0.12);
    }

    #modal-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    #modal-info {
        flex: 1;
        min-width: 0;
        background: rgba(255,255,255,0.9);
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 10px 24px rgba(230,0,18,0.12);
        border: 1px solid rgba(230,0,18,0.14);
    }

    #modal-info h2 {
        margin: 0 0 14px;
        font-size: 28px;
        color: var(--nintendo-contrast);
    }

    .meta-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px 18px;
    }

    .meta {
        margin: 0;
        font-size: 14px;
        color: #2a2a2a;
        line-height: 1.45;
    }

    .meta a {
        color: var(--nintendo-red);
        text-decoration: none;
    }

    .modal-card {
        border-radius: 20px;
        background: white;
        padding: 18px;
        box-shadow: 0 12px 26px rgba(0,0,0,0.08);
        border: 1px solid rgba(230,0,18,0.12);
    }

    .ratings-panel {
        padding: 12px;
        background: rgba(255,255,255,0.96);
        border-radius: 14px;
        margin-bottom: 12px;
        box-shadow: 0 8px 18px rgba(230,0,18,0.06);
        border: 1px solid rgba(230,0,18,0.08);
    }

    .ratings-panel .modal-card-header {
        font-size: 13px;
        margin-bottom: 8px;
    }

    .ratings-row {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px 12px;
    }

    .modal-card-header {
        font-size: 15px;
        font-weight: 700;
        margin-bottom: 12px;
        color: #111;
        text-transform: uppercase;
        letter-spacing: 0.06em;
    }

    #modal-desc {
        max-height: 168px;
        overflow: hidden;
        color: #3c3c3c;
        font-size: 14px;
        line-height: 1.7;
        position: relative;
    }

    #modal-desc::after {
        content: "";
        display: block;
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 52px;
        background: linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,0.98));
        pointer-events: none;
        transition: opacity 0.2s ease;
    }

    #modal-desc-card.expanded #modal-desc {
        max-height: none;
    }

    #modal-desc-card.expanded #modal-desc::after {
        opacity: 0;
    }

    #modal-banner img {
        width: 100%;
        height: auto;
        border-radius: 16px;
        display: block;
    }

    #modal-banner {
        padding-bottom: 12px;
    }

    /* =========================
       MODAL MÓVIL
    ========================= */
    @media (max-width: 768px) {
        #modal-content {
            padding: 16px;
            width: 96%;
            max-width: 680px;
        }

        #modal-top {
            flex-direction: column;
            gap: 14px;
        }

        #modal-img-wrap {
            flex: 1 1 auto;
            min-width: auto;
        }

        #modal-info {
            padding: 16px;
        }

        .meta-row {
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .modal-card {
            padding: 16px;
        }

        .expand-btn {
            width: 100%;
            justify-content: center;
        }

        .modal-card-header {
            font-size: 14px;
        }
    }

    /* =========================
       MOBILE
    ========================= */
    @media (max-width: 768px) {
        .grid {
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 4px;
            padding: 6px;
        }
        .img-box {
            height: 150px;
        }
        .title {
            font-size: 12px;
            padding: 6px 6px 2px;
        }
        .size {
            font-size: 10.5px;
            padding: 0 6px 6px;
        }
        
        .search-bar {
            width: 100%;
            flex-wrap: wrap;
        }
    }

    /* =========================
       BOTÓN PDF FLOTANTE
    ========================= */
    #downloadPdfBtn {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 55px;
        height: 55px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: var(--nintendo-red);
        color: white;
        text-decoration: none;
        font-size: 11px;
        font-weight: bold;
        box-shadow: 0 8px 20px rgba(230, 0, 18, 0.4);
        z-index: 1000;
        transition: transform 0.2s ease, background 0.2s ease;
    }

    #downloadPdfBtn:hover {
        transform: scale(1.12);
        background: #c2000f;
    }
</style>
</head>
<body>
<header>
  <div class="header-left">
    <a href="../../../index.html">
      <img src="logo.png" class="logo" alt="Logo">
    </a>
    <div class="nav-controls">
      <a href="index.html" class="nav-link">◀◀</a>
      <a href="index.html" class="nav-link">INICIO</a>
      <a href="index.html" class="nav-link">▶▶</a>
    </div>
  </div>
  <div class="search-bar">
    <input id="searchInput" type="text" placeholder="Buscar juego...">
    <select id="filterSelect"></select>
  </div>
</header>

<div id="grid" class="grid"></div>

<!-- MODAL -->
<div id="modal">
  <div id="modal-content">
    <button id="close-btn">✕</button>
    <div id="modal-body">
      <div id="modal-top">
        <div id="modal-img-wrap">
          <img id="modal-img">
        </div>
        <div id="modal-info">
                    <h2 id="modal-title"></h2>
                    <div class="ratings-panel">
                        <div class="modal-card-header">Valoraciones</div>
                        <div class="meta-row ratings-row">
                            <div class="meta">🎮 Nombre: <span id="modal-name"></span></div>
                            <div class="meta">💾 Tamaño: <span id="modal-size"></span> GB</div>
                            <div class="meta">⭐ Rating: <span id="modal-rating"></span></div>
                            <div class="meta">📅 Fecha: <span id="modal-release"></span></div>
                            <div class="meta">🏷️ Géneros: <span id="modal-genres"></span></div>
                            <div class="meta">🎯 Plataformas: <span id="modal-platforms"></span></div>
                            <div class="meta">📊 Metacritic: <a id="modal-metacritic-link" target="_blank"></a></div>
                        </div>
                    </div>
                    <section id="modal-desc-card" class="modal-card modal-desc-panel">
                        <div class="modal-card-header">Descripción</div>
                        <div id="modal-desc" class="modal-desc"></div>
                    </section>
                </div>
            </div>
            <section id="modal-banner" class="modal-card">
        <div class="modal-card-header">Vista del juego</div>
        <img id="modal-background">
      </section>
    </div>
  </div>
</div>

<a href="catalogo_whatsapp_NS(1).pdf" download id="downloadPdfBtn">
  ⬇ PDF
</a>

<script src="app.js"></script>
</body>
</html>
