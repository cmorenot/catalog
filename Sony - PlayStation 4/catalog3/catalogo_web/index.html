
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Catálogo PS4 CEMT (800-900)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b0f19;
  color: white;
}

/* =========================
   HEADER
========================= */
header {
  padding: 14px;
  background: #101b2d;
  position: sticky;
  top: 0;
  z-index: 10;

  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;

  overflow: hidden; /* 🔥 evita franjas raras */
}

/* LEFT SIDE (LOGO + NAV) */
.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* LOGO */
.logo {
  height: 32px;
  width: auto;
  display: block;
}

/* NAV */
.nav-controls {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px;
  background: linear-gradient(145deg, #1a2941, #111a2b);
  border: 1px solid rgba(148, 179, 225, 0.18);
  border-radius: 16px;
  box-shadow: 0 5px 16px rgba(0, 0, 0, 0.25);
}

.nav-link {
  text-decoration: none;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-width: 40px;
  height: 40px;
  padding: 0 10px;
  border: 1px solid transparent;
  border-radius: 11px;
  color: #cbd7ec;
  font-size: 12px;
  font-weight: 700;
  transition: color 0.2s ease, background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
}

.nav-link:not(.nav-home):hover {
  color: #fff;
  background: #263852;
  border-color: rgba(148, 179, 225, 0.2);
  transform: translateY(-1px);
}

.nav-link:focus-visible {
  outline: 2px solid #78aaff;
  outline-offset: 2px;
}

.nav-icon {
  width: 19px;
  height: 19px;
  flex: 0 0 auto;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.nav-home {
  min-width: 92px;
  color: #fff;
  background: linear-gradient(135deg, #347df0, #2458c4);
  box-shadow: 0 4px 12px rgba(45, 108, 223, 0.28);
}

.nav-home:hover {
  color: #fff;
  background: linear-gradient(135deg, #4b8cff, #2d6cdf);
  border-color: rgba(255, 255, 255, 0.2);
  transform: translateY(-1px);
}

/* =========================
   SEARCH BAR
========================= */
.search-bar {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-top: 10px;
}

.search-field,
.genre-filter {
  display: flex;
  align-items: center;
  height: 42px;
  box-sizing: border-box;
  border: 1px solid rgba(148, 179, 225, 0.18);
  border-radius: 13px;
  background: linear-gradient(145deg, #1a2941, #111a2b);
  box-shadow: 0 5px 16px rgba(0, 0, 0, 0.18);
  transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
}

.search-field {
  flex: 1;
  max-width: 330px;
  min-width: 180px;
  gap: 9px;
  padding: 0 12px;
}

.search-field:focus-within,
.genre-filter:focus-within {
  border-color: rgba(91, 151, 255, 0.75);
  background: #17253a;
  box-shadow: 0 0 0 3px rgba(45, 108, 223, 0.17), 0 5px 16px rgba(0, 0, 0, 0.18);
}

.search-icon {
  width: 18px;
  height: 18px;
  flex: 0 0 auto;
  fill: none;
  stroke: #8fa7ca;
  stroke-width: 1.8;
  stroke-linecap: round;
}

.search-field input {
  width: 100%;
  min-width: 0;
  padding: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: #f4f7fc;
  font: inherit;
  font-size: 13px;
}

.search-field input::placeholder {
  color: #8393ab;
}

.genre-filter {
  position: relative;
  min-width: 190px;
  max-width: 230px;
  padding: 0 34px 0 12px;
}

.genre-filter::after {
  position: absolute;
  top: 50%;
  right: 13px;
  width: 8px;
  height: 8px;
  border-right: 1.5px solid #9eb1cf;
  border-bottom: 1.5px solid #9eb1cf;
  content: "";
  pointer-events: none;
  transform: translateY(-70%) rotate(45deg);
}

.genre-filter select {
  width: 100%;
  height: 100%;
  padding: 0;
  border: 0;
  outline: 0;
  appearance: none;
  background: transparent;
  color: #dce7f8;
  font: inherit;
  font-size: 13px;
  cursor: pointer;
}

.genre-filter select option {
  background: #152238;
  color: #f4f7fc;
}

.search-field:focus-within .search-icon {
  stroke: #78aaff;
}

/* =========================
   GRID
========================= */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
  padding: 20px;
}

.card {
  background: #111826;
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}

.img-box {
  width: 100%;
  height: 320px;
}

.img-box img {
  width: 100%;
  height: 100%;
  object-fit: fill;
}

.title {
  padding: 8px 10px 0;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.size {
  padding: 0 10px 10px;
  font-size: 12px;
  color: #aaa;
}

/* =========================
   MOBILE GRID + HEADER FIX
========================= */
@media (max-width: 768px) {

  header {
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    padding-bottom: 10px;
  }

  .grid {
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    padding: 6px;
  }

  .img-box { height: 110px; }

  .title { font-size: 9px; }
  .size { font-size: 8px; }

  .search-bar {
    flex-wrap: nowrap;
    gap: 8px;
    width: 100%;
  }

  .search-field {
    min-width: 0;
    max-width: none;
  }

  .genre-filter {
    flex: 0 0 150px;
    min-width: 0;
    max-width: 150px;
  }
}

/* =========================
   MODAL (PC)
========================= */
#modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 999;
}

#modal-content {
  width: 92%;
  max-width: 1000px;
  max-height: 92vh;
  overflow-y: auto;
  background: #111826;
  border-radius: 14px;
  padding: 16px;
  position: relative;
}

#modal-body {
  display: flex;
  gap: 16px;
  align-items: flex-start;
}

#modal-img {
  width: 240px;
  object-fit: contain;
  border-radius: 10px;
  align-self: flex-start;
  margin-top: 0;
}

#modal-info {
  flex: 1;
}

.meta {
  margin: 6px 0;
  font-size: 13px;
  color: #ddd;
}

#modal-desc {
  margin-top: 10px;
  font-size: 13px;
  color: #ccc;
  line-height: 1.4;
}

#modal-banner img {
  width: 100%;
  border-radius: 10px;
  margin-top: 10px;
}

/* BOTÓN CERRAR */
#close-btn {
  position: absolute;
  top: 10px;
  right: 10px;
  background: #ff3b3b;
  border: none;
  color: white;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  cursor: pointer;
}

/* =========================
   MOBILE MODAL
========================= */
@media (max-width: 768px) {

  #modal-body {
    flex-direction: column;
    align-items: center;
  }

  #modal-img {
    width: 70%;
    display: block;
    margin: 0 auto;
  }

  #modal-info {
    text-align: center;
  }
}

/* =========================
   PDF BUTTON
========================= */
#downloadPdfBtn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 54px;
  padding: 0 17px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 18px;
  background: linear-gradient(140deg, #347df0, #214fae);
  color: #fff;
  text-decoration: none;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.04em;
  box-shadow: 0 8px 24px rgba(16, 63, 153, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.2);
  z-index: 1000;
  transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  backdrop-filter: blur(6px);
}

#downloadPdfBtn svg {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

#downloadPdfBtn span {
  padding: 4px 6px;
  border-radius: 6px;
  background: rgba(13, 31, 67, 0.3);
}

#downloadPdfBtn:hover {
  transform: translateY(-3px);
  background: linear-gradient(140deg, #4b8cff, #2b61c8);
  box-shadow: 0 12px 28px rgba(16, 63, 153, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.24);
}

#downloadPdfBtn:focus-visible {
  outline: 2px solid #fff;
  outline-offset: 3px;
}
</style>
</head>

<body>

<header>
  <div class="header-left">
    <img src="logo.png" class="logo" alt="Logo">

    <div class="nav-controls">
      <a href="../../catalog2/catalogo_web/index.html" class="nav-link" title="Catálogo anterior" aria-label="Ir al catálogo anterior">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m11 7-5 5 5 5M18 7l-5 5 5 5" />
        </svg>
      </a>
      <a href="../../index.html" class="nav-link nav-home" title="Inicio de PlayStation 4">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m3.5 10 8.5-7 8.5 7" />
          <path d="M5.5 9v11h13V9M9.5 20v-6h5v6" />
        </svg>
        <span>Inicio</span>
      </a>
      <a href="../../catalog4/catalogo_web/index.html" class="nav-link" title="Catálogo siguiente" aria-label="Ir al catálogo siguiente">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m13 7 5 5-5 5M6 7l5 5-5 5" />
        </svg>
      </a>
    </div>
  </div>

  <div class="search-bar">
    <label class="search-field">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="10.8" cy="10.8" r="6.3" />
        <path d="m15.5 15.5 4.2 4.2" />
      </svg>
      <input id="searchInput" type="text" placeholder="Buscar juego..." aria-label="Buscar juego">
    </label>

    <div class="genre-filter">
      <select id="filterSelect" aria-label="Filtrar por género"></select>
    </div>
  </div>
</header>

<div id="grid" class="grid"></div>

<!-- MODAL RESTAURADO -->
<div id="modal">
  <div id="modal-content">
    <button id="close-btn">✕</button>

    <div id="modal-body">
      <img id="modal-img">

      <div id="modal-info">
        <h2 id="modal-title"></h2>

        <div class="meta">🎮 Nombre: <span id="modal-name"></span></div>
        <div class="meta">💾 Tamaño: <span id="modal-size"></span> GB</div>
        <div class="meta">⭐ Rating: <span id="modal-rating"></span></div>
        <div class="meta">📅 Fecha: <span id="modal-release"></span></div>
        <div class="meta">🏷️ Géneros: <span id="modal-genres"></span></div>
        <div class="meta">🎯 Plataformas: <span id="modal-platforms"></span></div>

        <div class="meta">📊 Metacritic:
          <a id="modal-metacritic-link" target="_blank"></a>
        </div>

        <div id="modal-desc"></div>

        <div id="modal-banner">
          <img id="modal-background">
        </div>
      </div>
    </div>
  </div>
</div>
<a href="catalogo_whatsapp_800-900.pdf" download id="downloadPdfBtn" aria-label="Descargar catálogo en PDF" title="Descargar catálogo en PDF">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 3v11m0 0 4-4m-4 4-4-4" />
    <path d="M5 16v4a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-4" />
  </svg>
  <span>PDF</span>
</a>

<script src="app.js"></script>

</body>
</html>
