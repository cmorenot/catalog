<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PS5 Catálogos Hub</title>

<style>

:root{
    --blue:#2d7dff;
    --blue-light:#7fb2ff;
}

/* BASE */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI', Arial, sans-serif;
    min-height:100vh;
    color:white;

    background:
    radial-gradient(circle at top,
    rgba(255,255,255,.08),
    transparent 45%),
    linear-gradient(180deg,#0a0f1c,#0b1224);
}

/* LUZ PS5 */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at 50% 15%,
    rgba(45,125,255,.18),
    transparent 55%);
    pointer-events:none;
}

/* ===================== */
/* BANNER SUPERIOR       */
/* ===================== */

.top-banner{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:60px;

    background:rgba(255,255,255,.06);
    backdrop-filter:blur(14px);

    border-bottom:1px solid rgba(255,255,255,.10);

    z-index:999;

    display:flex;
    align-items:center;
    justify-content:center;
}

.top-banner .inner{
    width:min(1200px,92%);
    display:flex;
    align-items:center;
    justify-content:space-between;
}

/* BOTÓN PLATAFORMAS */
.top-banner a{
    text-decoration:none;
    color:#cfe2ff;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:8px;
    font-size:.9rem;
}

/* LOGO */
.logo img{
    height:38px;
}

/* STATUS */
.status{
    font-size:.85rem;
    color:#b8c0d6;
}

/* ESPACIO PARA NO TAPAR CONTENIDO */
body{
    padding-top:60px;
}

/* ===================== */
/* GRID PS5              */
/* ===================== */

.catalogs{
    width:min(1200px,92%);
    margin:auto;
    padding:50px 0;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
}

/* CARD */
.card{
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.10);
    border-radius:20px;
    overflow:hidden;

    backdrop-filter:blur(10px);

    transition:.3s;
}

.card:hover{
    transform:translateY(-6px);
    border-color:var(--blue);
    box-shadow:0 20px 50px rgba(45,125,255,.25);
}

/* IMAGEN */
.card-image{
    position:relative;
    height:180px;
    overflow:hidden;
}

.card-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.5s;
}

.card:hover img{
    transform:scale(1.07);
}

.card-image::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(to top,
    rgba(10,15,28,.95),
    rgba(10,15,28,.15));
}

/* BADGE */
.badge{
    position:absolute;
    top:12px;
    left:12px;
    background:rgba(45,125,255,.25);
    border:1px solid rgba(45,125,255,.5);
    color:#cfe2ff;

    padding:6px 12px;
    border-radius:20px;
    font-size:.75rem;
    font-weight:700;
    z-index:2;
}

/* CONTENT */
.content{
    padding:20px;
}

.content h2{
    font-size:1.2rem;
    margin-bottom:6px;
}

.firmware{
    color:#7fb2ff;
    font-weight:600;
    margin-bottom:10px;
    font-size:.9rem;
}

.games{
    color:#b8c0d6;
    margin-bottom:18px;
    font-size:.9rem;
}

/* BOTÓN */
.btn{
    display:block;
    text-align:center;
    text-decoration:none;

    background:var(--blue);
    color:white;

    padding:13px;
    border-radius:12px;

    font-weight:600;

    transition:.3s;
}

.btn:hover{
    background:#4b93ff;
}

@media(max-width:600px){
    .card-image{
        height:160px;
    }
}

</style>
</head>

<body>

<!-- BANNER -->
<div class="top-banner">

    <div class="inner">

        <!-- VOLVER PLATAFORMAS -->
        <a href="../index.html">
            <div class="logo">
              <img src="images/logo.png" alt="PS4 Logo" style="height:40px; vertical-align:middle;">
            </div>

        </a>

        <!-- ESTADO -->
        <div class="status">
            Catálogos PS5 activos
        </div>

    </div>

</div>

<!-- GRID -->
<div class="catalogs">

    <!-- CAT 1 -->
    <div class="card">

        <div class="card-image">
            <div class="badge">CAT 1</div>
            <img src="images/catalogo1.jpg">
        </div>

        <div class="content">
            <h2>Catálogo PS5 1</h2>
            <div class="firmware">Biblioteca PS5</div>
            <div class="games">Colección completa de juegos</div>
            <a class="btn" href="catalog1/catalogo_web/index.html">Abrir catálogo</a>
        </div>

    </div>

    <!-- CAT 2 -->
    <div class="card">

        <div class="card-image">
            <div class="badge">CAT 2</div>
            <img src="images/catalogo2.jpg">
        </div>

        <div class="content">
            <h2>Catálogo PS5 2</h2>
            <div class="firmware">Biblioteca PS5</div>
            <div class="games">Selección ampliada de juegos</div>
            <a class="btn" href="catalog2/catalogo_web/index.html">Abrir catálogo</a>
        </div>

    </div>

</div>

</body>
</html>
